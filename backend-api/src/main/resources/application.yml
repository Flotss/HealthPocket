spring:
  application:
    name: healthpocket-api

  # Database Configuration
  datasource: 
    url: ${DATABASE_URL:jdbc:postgresql://exemple.com:5432/exemple}
    username: ${DATABASE_USERNAME:exemple}
    password: ${DATABASE_PASSWORD:exemple}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto:  update
    show-sql: false
    properties:
      hibernate: 
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone:  UTC

  # Jackson Configuration
  jackson:
    serialization: 
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server Configuration
server:
  port:  ${PORT:8080}
  use-forward-headers: true
  error:
    include-message:  always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:exemple}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui: 
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: HealthPocket API
    description: REST API for HealthPocket mobile application
    version:  1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level: 
    root: INFO
    com. healthpocket: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
# Test Profile
spring: 
  config:
    activate: 
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name:  org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto:  create-drop
    properties: 
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
