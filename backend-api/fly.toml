# fly.toml app configuration file generated for healthpocket on 2026-01-05T21:58:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'healthpocket'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
